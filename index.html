<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicViz Ultra | Next-Gen Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #f093fb;
            --viz-green: #00ff42;
            --bg: #020202;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: white;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            transition: background 0.5s ease;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .gradient-border {
            position: relative;
            background: var(--glass);
            border-radius: 1.5rem;
            z-index: 1;
        }

        .gradient-border::before {
            content: "";
            position: absolute; inset: -1px;
            border-radius: 1.5rem; padding: 1px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.4;
        }

        .gradient-text {
            background-image: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            font-weight: 800;
        }

        #visualizer-canvas {
            image-rendering: auto;
            will-change: transform;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            backdrop-filter: blur(15px);
            align-items: center; justify-content: center;
        }

        #hidden-bg-video, #hidden-bg-img { display: none; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: black; font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 242, 254, 0.5);
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .rec-dot {
            width: 10px; height: 10px;
            background: #ff3e3e; border-radius: 50%;
            animation: pulse-red 1s infinite;
            box-shadow: 0 0 10px #ff3e3e;
        }

        .premium-tag {
            background: linear-gradient(45deg, #fceabb, #f8b500);
            -webkit-background-clip: text; background-clip: text;
            color: transparent; -webkit-text-fill-color: transparent;
            font-size: 0.75rem; font-weight: 900;
            letter-spacing: 0.15em;
        }

        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px; outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px;
            background: var(--primary); border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 10px var(--primary);
        }

        input[type="color"] {
            -webkit-appearance: none; appearance: none;
            border: none; width: 40px; height: 40px;
            background: transparent; cursor: pointer;
        }

        .ratio-standard { aspect-ratio: 16 / 9; max-width: 100%; }
        .ratio-shorts { 
            aspect-ratio: 9 / 16; 
            max-width: 360px !important; 
            margin: 0 auto; 
            border: 8px solid #111 !important; 
            border-radius: 3.5rem !important; 
        }

        .app-mode-active #studio-section { display: flex; justify-content: center; align-items: center; }
        .app-mode-active .sidebar-content { display: none; }
        .app-mode-active #capture-area { max-width: 340px; aspect-ratio: 9/16; border: 10px solid #111; }
        #mobile-settings-trigger { display: none; }
        .app-mode-active #mobile-settings-trigger { display: flex; position: fixed; bottom: 2rem; right: 2rem; z-index: 100; }
    </style>
</head>
<body class="custom-scrollbar" id="main-body">

    <nav class="fixed top-0 w-full z-[100] px-8 py-5 flex justify-between items-center glass-panel border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="relative group cursor-pointer" onclick="showSection('studio')">
                <div class="absolute -inset-2 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-lg blur opacity-20 group-hover:opacity-60 transition duration-700"></div>
                <div class="relative w-12 h-12 bg-black rounded-xl flex items-center justify-center border border-white/10">
                    <i class="fas fa-layer-group text-cyan-400 text-xl"></i>
                </div>
            </div>
            <div class="hidden sm:block">
                <span class="text-2xl font-black tracking-tighter uppercase leading-none block">SonicViz <span class="text-cyan-400">Ultra</span></span>
                <span class="text-[9px] uppercase tracking-[0.3em] text-gray-500 font-bold tracking-widest">Optimized Performance</span>
            </div>
        </div>
        
        <div class="hidden lg:flex gap-10 text-[11px] font-bold uppercase tracking-[0.2em] text-gray-400">
            <a href="#" class="hover:text-cyan-400 transition" onclick="showSection('studio')">Studio</a>
            <a href="#" class="hover:text-cyan-400 transition" onclick="showSection('marketplace')">Lab</a>
            <a href="#" class="hover:text-cyan-400 transition" onclick="showSection('pricing')">Licensing</a>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="toggleAppMode()" id="app-mode-btn" class="p-3 bg-white/5 border border-white/10 rounded-xl hover:text-cyan-400 transition-all group">
                <i class="fas fa-mobile-screen-button text-lg"></i>
            </button>
            <div id="premium-status-indicator" class="hidden">
                <span class="premium-tag px-4 py-2 border border-yellow-500/20 glass-panel rounded-full">ULTRA ACCESS</span>
            </div>
            <button id="upgrade-btn-nav" onclick="showSection('pricing')" class="btn-primary px-6 py-2.5 rounded-xl text-[10px] uppercase tracking-widest">
                Upgrade
            </button>
        </div>
    </nav>

    <button id="mobile-settings-trigger" onclick="openMobileMenu()" class="w-14 h-14 bg-cyan-500 text-black rounded-full flex items-center justify-center shadow-2xl transition active:scale-95">
        <i class="fas fa-sliders text-xl"></i>
    </button>

    <main class="pt-28 min-h-screen px-8 pb-12 transition-all duration-700">
        <section id="studio-section" class="max-w-[1700px] mx-auto grid grid-cols-1 xl:grid-cols-12 gap-10">
            <!-- Sidebar -->
            <div class="xl:col-span-3 space-y-8 sidebar-content">
                <div class="glass-panel p-8 rounded-[2.5rem] border border-white/5 space-y-6">
                    <h3 class="text-[11px] font-black text-gray-500 uppercase tracking-[0.25em]">Project Format</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="btn-ratio-video" onclick="setFormat('video')" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-cyan-400 transition-all format-btn-active">
                            <i class="fas fa-desktop"></i>
                            <span class="text-[9px] font-black uppercase">16:9</span>
                        </button>
                        <button id="btn-ratio-shorts" onclick="setFormat('shorts')" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-cyan-400 transition-all">
                            <i class="fas fa-mobile-alt"></i>
                            <span class="text-[9px] font-black uppercase">Shorts</span>
                        </button>
                    </div>
                </div>

                <div class="glass-panel p-8 rounded-[2.5rem] border border-white/5 space-y-6">
                    <h3 class="text-[11px] font-black text-gray-500 uppercase tracking-[0.25em]">Visual & Audio</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Accent Color</label>
                            <input type="color" id="viz-color-picker" value="#00ff42">
                        </div>
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Scale</label>
                                <span id="scale-val" class="text-[10px] font-mono text-cyan-400">1.00x</span>
                            </div>
                            <input type="range" id="viz-scale-slider" min="0.5" max="2.5" step="0.05" value="1.0">
                        </div>
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-[10px] font-bold text-yellow-500 uppercase">Bass Boost</label>
                                <span id="bass-val" class="text-[10px] font-mono text-yellow-500">+0 dB</span>
                            </div>
                            <input type="range" id="bass-boost-slider" min="0" max="20" step="1" value="0">
                        </div>
                    </div>
                </div>

                <div class="gradient-border p-8 space-y-4">
                    <h3 class="text-[11px] font-black text-gray-500 uppercase tracking-[0.25em]">Files</h3>
                    <label class="block w-full cursor-pointer bg-white/[0.03] border border-white/10 hover:border-cyan-400/50 p-6 rounded-3xl text-center transition-all">
                        <i class="fas fa-cloud-arrow-up text-2xl mb-2 text-cyan-400"></i>
                        <span class="block text-[10px] font-bold text-gray-300 uppercase">Inject Media</span>
                        <input type="file" id="file-input" class="hidden" accept="audio/*,video/*,image/*">
                    </label>
                </div>

                <div class="glass-panel p-8 rounded-[2.5rem] border border-white/5">
                    <select id="viz-style" class="w-full bg-black/60 border border-white/10 p-4 rounded-2xl text-xs focus:outline-none focus:border-cyan-500 font-bold uppercase tracking-widest">
                        <option value="circle">Neon Circle</option>
                        <option value="bars">Bars</option>
                        <optgroup label="PRO ULTRA MODES">
                            <option value="pro-ultra-circle" selected>PRO Green Nebula</option>
                            <option value="pro-triangle">PRO Sacred Geometry</option>
                        </optgroup>
                    </select>
                </div>

                <button id="record-btn" onclick="toggleRecording()" class="w-full py-5 bg-white/5 hover:bg-red-500/15 border border-white/10 rounded-2xl transition-all font-black text-[12px] uppercase tracking-[0.25em]">
                    Export Render
                </button>
            </div>

            <!-- Canvas Area -->
            <div class="xl:col-span-9 space-y-8">
                <div id="capture-area" class="relative w-full ratio-standard overflow-hidden bg-black shadow-2xl border border-white/10 transition-all duration-700">
                    <video id="hidden-bg-video" loop muted crossorigin="anonymous"></video>
                    <img id="hidden-bg-img" crossorigin="anonymous">
                    <canvas id="visualizer-canvas" class="w-full h-full relative z-10"></canvas>

                    <div id="recording-status" class="hidden absolute top-8 left-8 z-20 flex items-center gap-3 bg-black/70 backdrop-blur-xl px-5 py-2 rounded-full border border-red-500/40">
                        <div class="rec-dot"></div>
                        <span class="text-[10px] font-black uppercase text-red-500">Rec</span>
                    </div>

                    <div class="absolute inset-x-0 bottom-10 z-20 flex justify-center items-center">
                        <div class="glass-panel px-8 py-5 rounded-full border border-white/10 flex items-center gap-6 hud-controls">
                            <button onclick="togglePlay()" class="text-4xl text-white hover:text-cyan-400 transition-all transform hover:scale-110 active:scale-95">
                                <i id="play-icon" class="fas fa-play"></i>
                            </button>
                            <div class="flex flex-col gap-1.5">
                                <div class="relative w-64 h-1.5 bg-white/5 rounded-full overflow-hidden hud-progress">
                                    <div id="progress" class="absolute inset-y-0 left-0 bg-gradient-to-r from-cyan-400 to-indigo-600 w-0"></div>
                                </div>
                                <div class="flex justify-between font-mono text-[9px] font-black text-gray-500 uppercase tracking-widest">
                                    <span id="time-current">00:00:00</span>
                                    <span id="time-total">00:00:00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="mobile-menu" class="modal-overlay">
        <div class="glass-panel p-10 rounded-[3rem] w-full max-w-md mx-4 max-h-[80vh] overflow-y-auto space-y-8 border border-white/10">
            <div id="mobile-settings-target" class="space-y-6"></div>
            <button onclick="closeMobileMenu()" class="w-full py-4 bg-white/5 rounded-2xl uppercase font-black text-xs">Zatvoriť</button>
        </div>
    </div>

    <div id="payment-modal" class="modal-overlay">
        <div class="glass-panel p-12 rounded-[4rem] max-w-md w-full mx-4 relative border border-white/10 text-center">
            <h2 class="text-4xl font-black uppercase mb-8">Secure <span class="gradient-text">Studio</span></h2>
            <button onclick="handleIDBPremiumPurchase()" class="w-full py-6 btn-primary rounded-[2rem] font-black text-xl uppercase tracking-widest">Unlock PRO</button>
            <button onclick="closeModal('payment-modal')" class="mt-4 text-xs text-gray-500 uppercase font-bold tracking-widest">Zrušiť</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-12 right-12 glass-panel px-10 py-6 rounded-[2rem] hidden transform translate-y-40 transition-all duration-500 flex items-center gap-6 z-[2000] border border-white/10">
        <div id="toast-icon" class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-inner"></div>
        <div id="toast-msg" class="font-black text-[10px] uppercase"></div>
    </div>

    <script>
        const DB_NAME = 'SonicVizUltraDB';
        const STORE_NAME = 'metaData';
        let db;

        async function initIndexedDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 8);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
            });
        }

        async function getFromDB(key) {
            return new Promise((r) => {
                const tx = db.transaction([STORE_NAME], 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => r(req.result);
                req.onerror = () => r(null);
            });
        }

        async function saveToDB(key, val) {
            return new Promise((r) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const req = tx.objectStore(STORE_NAME).put(val, key);
                req.onsuccess = () => r(true);
            });
        }

        // --- CORE STATE ---
        let isPremium = false, audioContext, analyser, dataArray, source, audioStreamDest, 
            isPlaying = false, animationId, mediaRecorder, recordedChunks = [], isRecording = false, 
            bgType = 'none', isAppMode = false, currentFormat = 'video';

        let vizColor = '#00ff42', vizScale = 1.0, bassGain = 0;
        let bassFilter, compressor;

        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('file-input');
        const hiddenVideo = document.getElementById('hidden-bg-video');
        const hiddenImg = document.getElementById('hidden-bg-img');
        const colorPicker = document.getElementById('viz-color-picker');
        const scaleSlider = document.getElementById('viz-scale-slider');
        const bassSlider = document.getElementById('bass-boost-slider');
        const audio = new Audio(); audio.crossOrigin = "anonymous";

        window.onload = async () => {
            await initIndexedDB();
            await syncPremiumStatus();
            await loadStudioSettings();
            
            const savedAppMode = await getFromDB('appMode');
            if(savedAppMode) setAppMode(true);
            
            const savedFormat = await getFromDB('projectFormat');
            if(savedFormat) setFormat(savedFormat);

            resizeCanvas();
            drawLoop();
            setInterval(syncPremiumStatus, 30000);
        };

        // --- STUDIO LOGIC ---
        async function loadStudioSettings() {
            const settings = await getFromDB('visualSettings');
            if (settings) {
                vizColor = settings.color || '#00ff42'; vizScale = settings.scale || 1.0; bassGain = settings.bassGain || 0;
                colorPicker.value = vizColor; scaleSlider.value = vizScale; bassSlider.value = bassGain;
                document.getElementById('bass-val').innerText = `+${bassGain} dB`;
                document.getElementById('scale-val').innerText = vizScale.toFixed(2) + 'x';
            }
        }

        async function saveStudioSettings() { await saveToDB('visualSettings', { color: vizColor, scale: vizScale, bassGain: bassGain }); }

        colorPicker.oninput = (e) => { vizColor = e.target.value; saveStudioSettings(); };
        scaleSlider.oninput = (e) => { vizScale = parseFloat(e.target.value); document.getElementById('scale-val').innerText = vizScale.toFixed(2) + 'x'; saveStudioSettings(); };
        bassSlider.oninput = (e) => { bassGain = parseFloat(e.target.value); document.getElementById('bass-val').innerText = `+${bassGain} dB`; if (bassFilter) bassFilter.gain.value = bassGain; saveStudioSettings(); };

        // --- FORMAT LOGIC ---
        window.setFormat = async (format) => {
            currentFormat = format;
            const area = document.getElementById('capture-area');
            const bV = document.getElementById('btn-ratio-video');
            const bS = document.getElementById('btn-ratio-shorts');

            area.classList.remove('ratio-standard', 'ratio-shorts');
            bV.classList.remove('format-btn-active');
            bS.classList.remove('format-btn-active');

            if (format === 'video') { area.classList.add('ratio-standard'); bV.classList.add('format-btn-active'); }
            else { area.classList.add('ratio-shorts'); bS.classList.add('format-btn-active'); }

            await saveToDB('projectFormat', format);
            setTimeout(resizeCanvas, 300);
        };

        window.toggleAppMode = async () => { isAppMode = !isAppMode; setAppMode(isAppMode); await saveToDB('appMode', isAppMode); };

        function setAppMode(active) {
            const body = document.getElementById('main-body');
            isAppMode = active;
            if (active) body.classList.add('app-mode-active');
            else body.classList.remove('app-mode-active');
            setTimeout(resizeCanvas, 600);
        }

        window.openMobileMenu = () => {
            const target = document.getElementById('mobile-settings-target');
            const source = document.querySelector('.xl\\:col-span-3');
            target.innerHTML = source.innerHTML;
            document.getElementById('mobile-menu').style.display = 'flex';
        };

        window.closeMobileMenu = () => document.getElementById('mobile-menu').style.display = 'none';

        async function syncPremiumStatus() {
            const profile = await getFromDB('userProfile');
            const now = Date.now();
            const ind = document.getElementById('premium-status-indicator');
            const upg = document.getElementById('upgrade-btn-nav');
            if (profile && profile.isPremium && profile.expiryDate > now) {
                isPremium = true; ind.classList.remove('hidden'); upg.classList.add('hidden');
            } else {
                isPremium = false; ind.classList.add('hidden'); upg.classList.remove('hidden');
            }
        }

        window.handleIDBPremiumPurchase = async () => {
            const expiry = Date.now() + (30 * 24 * 60 * 60 * 1000);
            await saveToDB('userProfile', { isPremium: true, expiryDate: expiry });
            await syncPremiumStatus();
            closeModal('payment-modal');
            showToast("ULTRA ACCESS ACTIVATED", "success");
        };

        window.onresize = resizeCanvas;
        window.showSection = (id) => {
            ['studio-section', 'marketplace-section', 'pricing-section'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
        };
        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        function resizeCanvas() {
            const container = document.getElementById('capture-area');
            if (container) {
                // Adaptive Performance Scale
                const isMobile = window.innerWidth < 768;
                const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
                canvas.width = container.clientWidth * dpr;
                canvas.height = container.clientHeight * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('audio/')) { audio.src = url; showToast("AUDIO INJECTED", "success"); }
            else if (file.type.startsWith('video/')) { hiddenVideo.src = url; bgType = 'video'; hiddenVideo.play(); }
            else if (file.type.startsWith('image/')) { hiddenImg.src = url; bgType = 'image'; }
            if (!audioContext) initStudioEngine();
        };

        function initStudioEngine() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            source = audioContext.createMediaElementSource(audio);
            bassFilter = audioContext.createBiquadFilter();
            bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 200; bassFilter.gain.value = bassGain;
            compressor = audioContext.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-24, audioContext.currentTime);
            analyser = audioContext.createAnalyser(); analyser.fftSize = 512;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            audioStreamDest = audioContext.createMediaStreamDestination();
            source.connect(bassFilter); bassFilter.connect(compressor); compressor.connect(analyser);
            analyser.connect(audioContext.destination); analyser.connect(audioStreamDest);
        }

        window.togglePlay = () => {
            if (!audio.src) return showToast("NO SOURCE", "error");
            if (audioContext?.state === 'suspended') audioContext.resume();
            if (isPlaying) audio.pause(); else audio.play();
            isPlaying = !isPlaying;
            document.getElementById('play-icon').className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
        };

        audio.ontimeupdate = () => {
            document.getElementById('progress').style.width = (audio.currentTime / audio.duration) * 100 + '%';
            document.getElementById('time-current').innerText = formatTime(audio.currentTime);
        };
        audio.onloadedmetadata = () => document.getElementById('time-total').innerText = formatTime(audio.duration);
        audio.onended = () => { if (isRecording) stopRecording(); isPlaying = false; document.getElementById('play-icon').className = 'fas fa-play'; };

        function formatTime(s) {
            const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const sec = Math.floor(s % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        window.toggleRecording = () => { if (!audio.src) return showToast("NO AUDIO", "error"); if (!isRecording) startRecording(); else stopRecording(); };

        function startRecording() {
            isRecording = true; recordedChunks = [];
            const combined = new MediaStream([...canvas.captureStream(60).getVideoTracks(), ...audioStreamDest.stream.getAudioTracks()]);
            mediaRecorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9,opus' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
                a.download = `SonicUltra_Render_${Date.now()}.webm`; a.click();
            };
            mediaRecorder.start();
            document.getElementById('recording-status').classList.remove('hidden');
            if (!isPlaying) togglePlay();
        }

        function stopRecording() {
            isRecording = false; if (mediaRecorder) mediaRecorder.stop();
            document.getElementById('recording-status').classList.add('hidden');
        }

        // --- OPTIMIZED DRAW LOOP ---
        function drawLoop() {
            animationId = requestAnimationFrame(drawLoop);
            
            // Skip rendering if not playing or recording to save resources
            if(!isPlaying && !isRecording) return;
            
            if(analyser) analyser.getByteFrequencyData(dataArray);

            const dpr = window.devicePixelRatio || 1;
            const w = canvas.width / dpr, h = canvas.height / dpr, centerX = w / 2, centerY = h / 2;

            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#020202";
            ctx.fillRect(0, 0, w, h);

            // Background
            ctx.save();
            ctx.globalAlpha = 0.90; 
            if (bgType === 'video' && hiddenVideo.readyState >= 2) {
                const vRatio = hiddenVideo.videoWidth / hiddenVideo.videoHeight;
                let dw, dh, dx, dy;
                if ((w / h) > vRatio) { dw = w; dh = w / vRatio; dx = 0; dy = (h - dh) / 2; }
                else { dh = h; dw = h * vRatio; dx = (w - dw) / 2; dy = 0; }
                ctx.drawImage(hiddenVideo, dx, dy, dw, dh);
            } else if (bgType === 'image' && hiddenImg.complete) {
                const iRatio = hiddenImg.naturalWidth / hiddenImg.naturalHeight;
                let dw, dh, dx, dy;
                if ((w / h) > iRatio) { dw = w; dh = w / iRatio; dx = 0; dy = (h - dh) / 2; }
                else { dh = h; dw = h * iRatio; dx = (w - dw) / 2; dy = 0; }
                ctx.drawImage(hiddenImg, dx, dy, dw, dh);
            }
            ctx.restore();

            if(!analyser) return;

            const style = document.getElementById('viz-style').value;
            if (style.startsWith('pro-') && !isPremium) {
                ctx.fillStyle = "rgba(0,0,0,0.96)"; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = "#00f2fe"; ctx.font = "900 24px 'Plus Jakarta Sans'"; ctx.textAlign = "center";
                ctx.fillText("UNLOCK ULTRA STUDIO ACCESS", centerX, centerY);
                return;
            }

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const responsiveScale = (currentFormat === 'shorts' ? 0.6 : 1.0) * vizScale;

            if (style === 'pro-ultra-circle') {
                const bassValue = (dataArray[1] + dataArray[2] + dataArray[3]) / 3;
                const bassResponse = (bassValue / 255) * 60 * responsiveScale;
                const baseRadius = (160 * responsiveScale) + bassResponse;
                
                // Optimized core ring with shadow
                ctx.shadowBlur = 40; ctx.shadowColor = vizColor; ctx.strokeStyle = vizColor; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(centerX, centerY, baseRadius, 0, Math.PI * 2); ctx.stroke();

                // Optimized fibers (no shadow for speed)
                ctx.shadowBlur = 0;
                const fiberStep = window.innerWidth < 768 ? 4 : 2; // Fewer fibers on mobile
                for (let i = 0; i < dataArray.length; i += fiberStep) {
                    const angle = (i / dataArray.length) * Math.PI * 2 + (Date.now() / 2500);
                    const magnitude = dataArray[i];
                    const fuzzyLen = (magnitude / 255) * 140 * responsiveScale;
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX + Math.cos(angle) * baseRadius, centerY + Math.sin(angle) * baseRadius);
                    ctx.lineTo(centerX + Math.cos(angle) * (baseRadius + fuzzyLen), centerY + Math.sin(angle) * (baseRadius + fuzzyLen));
                    ctx.strokeStyle = vizColor; ctx.globalAlpha = 0.2; ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            } else if (style === 'pro-triangle') {
                ctx.save(); ctx.translate(centerX, centerY);
                const br = (200 * responsiveScale) + dataArray[2]/2; ctx.rotate(Date.now()/3000);
                ctx.shadowBlur = 30; ctx.shadowColor = vizColor; ctx.lineWidth = 5;
                for(let k=0; k<2; k++) {
                    ctx.rotate(k * Math.PI/4); ctx.beginPath();
                    for(let i=0; i<3; i++) {
                        const a = (i*2*Math.PI)/3; const x = Math.cos(a)*br; const y = Math.sin(a)*br;
                        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                    }
                    ctx.closePath(); ctx.strokeStyle = k===0 ? vizColor : '#f093fb'; ctx.stroke();
                }
                ctx.restore();
            } else if (style === 'circle') {
                const r = 220 * responsiveScale; ctx.shadowBlur = 20; ctx.shadowColor = vizColor;
                for(let i=0; i<dataArray.length; i += 2) {
                    const bh = (dataArray[i]/255)*160*responsiveScale; const a = (i/dataArray.length)*Math.PI*2;
                    ctx.beginPath();
                    ctx.moveTo(centerX+Math.cos(a)*r, centerY+Math.sin(a)*r);
                    ctx.lineTo(centerX+Math.cos(a)*(r+bh), centerY+Math.sin(a)*(r+bh));
                    ctx.strokeStyle = vizColor; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
                }
            } else {
                const bw = (w/dataArray.length);
                for(let i=0; i<dataArray.length; i++) {
                    const bh = (dataArray[i]/255)*(h * 0.4);
                    ctx.fillStyle = vizColor; ctx.fillRect(i*bw, h-bh, bw-1, bh);
                }
            }
            ctx.restore();
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            icon.className = `w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${type==='success'?'bg-green-500/20 text-green-400':'bg-red-500/20 text-red-400'}`;
            icon.innerHTML = `<i class="fas fa-${type==='success'?'check':'bolt-lightning'}"></i>`;
            toast.classList.remove('hidden'); setTimeout(() => toast.classList.remove('translate-y-40'), 10);
            setTimeout(() => { toast.classList.add('translate-y-40'); setTimeout(() => toast.classList.add('hidden'), 500); }, 4000);
        }
    </script>
